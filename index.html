<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המסע לאוצר הכפל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0e3a4a; --sea-deep:#072631; --foam:#cfe9ee;
  --parch:#f6e7c6; --parch-2:#e8d09c; --ink:#3a2817;
  --gold:#f2b632; --coral:#e4573f; --leaf:#4f9d69; --violet:#7a5cc9;
  --display:"Secular One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
  /* layout: treasure map (right) beside the turn panel (left); stacks on narrow screens */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--body);color:var(--ink);
  background:
    radial-gradient(1200px 500px at 80% -10%, #1d5a6c 0%, transparent 60%),
    radial-gradient(900px 600px at 0% 110%, #0a4a5a 0%, transparent 60%),
    var(--sea);
  min-height:100%;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--foam)}
.who{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.35rem;color:#fff}
.avatar{font-size:1.8rem}
.hearts{font-size:1.4rem;letter-spacing:2px}
.pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-weight:700;font-size:1.05rem;color:#fff;font-variant-numeric:tabular-nums}
.hud-btns{margin-inline-start:auto;display:flex;gap:6px}
.btn{border:0;border-radius:14px;padding:10px 18px;font-size:1.1rem;font-weight:700;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #b07d10;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b07d10}
.btn[disabled]{opacity:.45;cursor:default}
.btn.big{font-size:1.35rem;padding:14px 28px}
.btn.small{font-size:.95rem;padding:7px 12px;background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.btn.ghost{background:var(--parch-2);box-shadow:0 3px 0 #b89a5c}

/* race bar */
.race{background:rgba(0,0,0,.18);border-radius:999px;padding:6px 44px 6px 18px;position:relative}
.track{position:relative;height:30px;border-bottom:3px dashed rgba(255,255,255,.35)}
.rt{position:absolute;bottom:-6px;font-size:1.6rem;transform:translateX(50%);transition:inset-inline-start .3s}
.rt#rX{bottom:-12px;font-size:1.3rem}
#rP{bottom:2px}
.goal{position:absolute;inset-inline-end:-36px;bottom:-4px;font-size:1.7rem}

/* main grid */
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:1fr}}

/* map */
.map-card{background:var(--parch);border-radius:22px;padding:10px;box-shadow:inset 0 0 40px rgba(140,95,30,.35),0 10px 30px rgba(0,0,0,.35)}
.map{position:relative;width:100%;aspect-ratio:6/5;container-type:inline-size;
  background:
    radial-gradient(circle at 20% 30%, rgba(160,120,50,.12) 0 8%, transparent 9%),
    radial-gradient(circle at 75% 70%, rgba(160,120,50,.10) 0 10%, transparent 11%);
  border-radius:14px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.sq{position:absolute;width:12.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;font-size:6cqw;background:#fff8e6;border:.5cqw solid #c9a86a;box-shadow:0 .6cqw 0 rgba(120,80,20,.25)}
.sq .n{font-size:2.4cqw;color:#a88a55;font-weight:700}
.sq.chest{background:#ffe9a8;border-color:var(--gold)}
.sq.magic{background:#e6dcff;border-color:var(--violet)}
.sq.echo{background:#d8f0f4;border-color:#3a9bb0}
.sq.monster{background:#ffd9d0;border-color:var(--coral)}
.sq.dragon{background:#ffc9bd;border-color:#b8321f;border-width:.8cqw}
.sq.castle{width:16%;font-size:9cqw;background:#fff1c9;border-color:var(--gold);border-width:.9cqw}
.sq.start{background:#d9f2df;border-color:var(--leaf)}
.token{position:absolute;font-size:7cqw;transform:translate(-50%,-70%);transition:left .25s ease,top .25s ease;filter:drop-shadow(0 .5cqw .3cqw rgba(0,0,0,.35));z-index:3;pointer-events:none}
.token.pirate{z-index:2;font-size:6cqw}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;padding:8px 4px 2px;font-size:.95rem;color:#6b5234}

/* panel */
.panel{background:var(--parch);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35);min-height:420px;display:flex}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
#stage h2{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0;text-wrap:balance}
.sub{margin:0;font-size:1.08rem;color:#6b5234;max-width:42ch;line-height:1.45}
.dice{display:flex;gap:14px;justify-content:center;margin:6px 0}
.die{width:78px;height:78px;border-radius:18px;background:#fff;border:3px solid #c9a86a;font-size:2.3rem;font-weight:700;display:grid;place-items:center;color:var(--ink);box-shadow:0 5px 0 #b89a5c;line-height:1}
.die small{font-size:1rem;display:block}
.die.idle{color:#c9a86a}
.die.joker{background:#efe6ff;border-color:var(--violet)}
.die.gold{background:#fff0bf;border-color:var(--gold)}
.die.sel{transform:translateY(-6px);border-color:var(--leaf);box-shadow:0 0 0 4px rgba(79,157,105,.4),0 8px 0 #3b7a50}
.die.small{width:64px;height:64px;font-size:2rem}

.expr{font-size:3.2rem;font-weight:700;display:flex;align-items:center;gap:14px;justify-content:center;font-variant-numeric:tabular-nums}
.ans{min-width:110px;padding:2px 12px;border-bottom:5px solid var(--ink);display:inline-block;color:var(--violet)}
.expr.ok .ans{color:var(--leaf);border-color:var(--leaf)}
.expr.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.note{font-size:1.3rem;font-weight:700;color:#6b5234}
.hint{min-height:1.5em;font-size:1.1rem;line-height:1.5;max-width:44ch;color:#4a3520}
.hint .box{background:#fff8e6;border:2px dashed #c9a86a;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.m{font-weight:700;white-space:nowrap;unicode-bidi:isolate}
.dots{display:inline-grid;gap:4px;direction:ltr}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--coral);display:block}
.dots i.c5{margin-right:6px}
.dots i.r5{margin-bottom:6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.key{height:56px;border-radius:14px;border:0;background:#fff;font-size:1.6rem;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #c9a86a}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a86a}
.key.go{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #2f6b44}
.key.fn{background:var(--parch-2)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.monster-head{font-size:4rem;line-height:1}
.hp{font-size:1.2rem;letter-spacing:3px;color:#b8321f}
.locks{font-size:2.6rem;letter-spacing:6px}
.card-icon{font-size:4.2rem;line-height:1}
.card p{font-size:1.2rem;line-height:1.55;max-width:40ch;margin:0}
.ex{display:block;margin-top:10px;font-size:1.4rem;font-weight:700;color:var(--violet)}
.pirate-big{font-size:4rem}
.bigmsg{font-family:var(--display);font-size:2.2rem;color:var(--leaf)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(4,22,30,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--parch);border-radius:24px;padding:24px;max-width:560px;width:100%;max-height:90%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h1{font-family:var(--display);font-weight:400;font-size:2.3rem;margin:0;color:var(--sea)}
.modal h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0}
.modal label{font-weight:700;font-size:1.1rem}
.modal input{font:inherit;font-size:1.3rem;padding:10px 14px;border-radius:12px;border:2px solid #c9a86a;background:#fff;text-align:center;width:min(100%,280px);align-self:center}
.chars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chars button{font-size:2.4rem;width:70px;height:70px;border-radius:18px;border:3px solid transparent;background:#fff}
.chars button[aria-pressed="true"]{border-color:var(--leaf);background:#e3f4e8}
.list{display:flex;flex-direction:column;gap:10px;text-align:start}
.trick{background:#fff8e6;border-radius:14px;padding:12px 14px;border-inline-start:5px solid var(--violet)}
.trick b{font-size:1.15rem}
.trick.locked{opacity:.5;border-color:#c9a86a}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:#fff;border-radius:10px;padding:5px 10px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.trophy{font-size:5rem;line-height:1}
.cert{isolation:isolate;background:#fffaf0;border:6px double #c9a86a;border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.medal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;position:relative;margin-top:26px;
  font-family:var(--display);font-size:2.8rem;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 4px 10px rgba(0,0,0,.25)}
.medal::before{content:"";position:absolute;top:-30px;left:50%;width:44px;height:40px;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--coral) 0 50%,#2f7fb0 50%);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);z-index:-1}
.medal.gold{background:radial-gradient(circle at 35% 30%,#ffe58a,#f2b632 55%,#c98a10)}
.medal.silver{background:radial-gradient(circle at 35% 30%,#ffffff,#c7d0d8 55%,#8e9aa5)}
.medal span{text-shadow:0 2px 0 rgba(0,0,0,.2)}
.cert-title{font-family:var(--display);font-size:2rem;color:var(--sea)}
.cert-name{font-family:var(--display);font-size:1.7rem}
.cert-stars{font-size:1.4rem;font-weight:700}
.cert-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
@media (max-width:480px){.cert-cols{grid-template-columns:1fr}}
.cert-col{border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cert-col.ok{background:#e3f4e8}.cert-col.bad{background:#fde6dc}
.cert-h{font-weight:700;font-size:1.2rem}
.chip.ok{color:#2f6b44}.chip.bad{color:#b8321f}
.cert-date{color:#8a7050;font-size:.95rem}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .expr{font-size:2.4rem}.die{width:64px;height:64px;font-size:1.9rem}
  .pad{grid-template-columns:repeat(3,58px)}.hud-btns{margin-inline-start:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <div class="who"><span class="avatar" id="avatar">🧜‍♀️</span><span id="pname">הרפתקנית</span></div>
    <div class="hearts" id="hearts" aria-label="לבבות">❤️❤️❤️</div>
    <div class="pill" id="stars" title="כוכבים">⭐ 0</div>
    
    <div class="hud-btns">
      <button class="btn small" id="bookBtn">📖 ספר הכשפים</button>
      <button class="btn small" id="logBtn">📜 ספר ההרפתקאות</button>
      <button class="btn small" id="muteBtn" aria-label="צליל">🔊</button>
    </div>
  </header>
  <div class="race" aria-label="המירוץ מול הפיראט">
    <div class="track"><span class="rt" id="rP">🧜‍♀️</span><span class="rt" id="rX">🏴‍☠️</span><span class="goal">🏰</span></div>
  </div>
  <main class="game">
    <section class="map-card">
      <div class="map" id="map"></div>
      <div class="legend"><span>🎁 תיבת הפתעות</span><span>✨ כשף חדש</span><span>🔮 קלף ההד</span><span>👾 מפלצת</span><span>🐉 הדרקון</span><span>🏴‍☠️ הפיראט</span></div>
    </section>
    <section class="panel"><div id="stage"></div></section>
  </main>
</div>

<div class="overlay on" id="startOv">
  <div class="modal">
    <h1>המסע לאוצר הכפל</h1>
    <p class="sub" style="align-self:center">הפיראט כבר יצא לדרך! פתרי תרגילי כפל, אספי כשפים, נצחי את הדרקון והגיעי לטירה לפניו.</p>
    <label for="nameInput">איך קוראים לך?</label>
    <input id="nameInput" maxlength="14" placeholder="השם שלך" autocomplete="off">
    <label>בחרי דמות</label>
    <div class="chars" id="chars"></div>
    <button class="btn big" id="startBtn">יוצאים לדרך!</button>
  </div>
</div>
<div class="overlay" id="infoOv"><div class="modal" id="infoBody"></div></div>
<canvas id="fx"></canvas>

<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const store={
  get(k,d){try{const v=localStorage.getItem('mtq_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('mtq_'+k,JSON.stringify(v))}catch(e){}}
};
const M=s=>`<span class="m" dir="ltr">${s}</span>`;

/* ---------- sound ---------- */
let AC=null, muted=store.get('muted',false);
function tone(f,d=.12,type='sine',v=.08){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const sfx={
  ok(){tone(660);setTimeout(()=>tone(880),110)},
  soft(){tone(320,.18,'triangle',.05)},
  step(){tone(540,.05,'square',.025)},
  roll(){tone(180+Math.random()*220,.04,'square',.025)},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*150))},
  magic(){[880,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,.15,'sine',.05),i*90))}
};

/* ---------- dice: 1 and 10 come up less often ---------- */
const WEIGHTS=[0,.35,1,1,1,1,1,2.2,2.2,1,.35];  // 7 and 8 ~20% each, 1 and 10 ~3%, others ~9%
function rollDie(){const tot=WEIGHTS.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let v=1;v<=10;v++){r-=WEIGHTS[v];if(r<=0)return v}return 6}

/* ---------- saved progress ---------- */
let stats=store.get('stats',{}), log=store.get('log',[]), tricks=store.get('tricks',[]),
    dragons=store.get('dragons',{}), pets=store.get('pets',[]), best=store.get('best',0);
const key=(a,b)=>Math.min(a,b)+'x'+Math.max(a,b);
function recordFact(a,b,ok){const k=key(a,b);const s=stats[k]||{r:0,w:0};ok?s.r++:s.w++;stats[k]=s;store.set('stats',stats)}
function addLog(a,b){const e={a,b,c:a*b};S.sessionLog.push(e);log.push(e);if(log.length>40)log=log.slice(-40);store.set('log',log)}
const DEFAULTS=[[7,8],[8,8],[7,7],[6,7],[6,8],[7,9],[8,9],[4,7],[4,8],[3,7],[3,8],[5,7]];
function weakList(){
  const arr=Object.entries(stats).filter(([k,v])=>v.w>0).map(([k,v])=>{const[a,b]=k.split('x').map(Number);return{a,b,k,score:v.w*3-v.r}})
    .filter(o=>o.score>-3).sort((x,y)=>y.score-x.score);
  const seen=new Set(arr.map(o=>o.k));
  for(const[a,b]of DEFAULTS){const k=key(a,b);if(seen.has(k))continue;const s=stats[k];if(s&&s.r>=3&&s.w===0)continue;arr.push({a,b,k,score:-99});seen.add(k)}
  if(arr.length<3)for(const[a,b]of DEFAULTS){const k=key(a,b);if(!seen.has(k)){arr.push({a,b,k,score:-100});seen.add(k)}}
  return arr;
}
const orient=(a,b)=>Math.random()<.5?[a,b]:[b,a];
function pickWeak(top=6){const l=weakList().slice(0,top);const o=l[Math.floor(Math.random()*l.length)];return orient(o.a,o.b)}
function nemesis(){const l=weakList().filter(o=>!pets.includes(o.k));return l[0]||{a:7,b:8,k:'7x8'}}

/* ---------- tricks ---------- */
const TRICKS=[
  {id:'t10',icon:'🔟',name:'הסוד של 10',text:'כופלים ב־10? כותבים את המספר ומוסיפים אפס בסוף.',ex:'7 × 10 = 70',p:()=>[rnd(2,9),10]},
  {id:'tswap',icon:'🔄',name:'המהפך',text:'הסדר לא משנה! 3 × 8 זה בדיוק כמו 8 × 3. בוחרים את הסדר שקל יותר.',ex:'2 × 9 = 9 × 2 = 18',p:()=>[rnd(2,3),rnd(6,9)]},
  {id:'t5',icon:'🖐️',name:'חצי מ־10',text:'כפול 5 זה חצי מכפול 10. קודם כפול 10, ואז חצי.',ex:'8 × 5 = (8 × 10) ÷ 2 = 40',p:()=>[rnd(3,9),5]},
  {id:'t9',icon:'9️⃣',name:'כמעט 10',text:'כפול 9 זה כפול 10, פחות פעם אחת המספר.',ex:'6 × 9 = 60 − 6 = 54',p:()=>[rnd(3,9),9]},
  {id:'t4',icon:'🪞',name:'הכפלה כפולה',text:'כפול 4 זה להכפיל, ואז להכפיל שוב.',ex:'7 × 4 → 14 → 28',p:()=>[rnd(3,9),4]},
  {id:'t6',icon:'➕',name:'חמש ועוד אחת',text:'כפול 6 זה כפול 5, ועוד פעם אחת המספר.',ex:'7 × 6 = 35 + 7 = 42',p:()=>[rnd(3,9),6]},
  {id:'t8',icon:'🎱',name:'שלוש הכפלות',text:'כפול 8 זה להכפיל שלוש פעמים ברצף.',ex:'6 × 8 → 12 → 24 → 48',p:()=>[rnd(3,9),8]},
  {id:'tsplit',icon:'✂️',name:'הפירוק',text:'תרגיל קשה? מפרקים אותו לשני תרגילים קלים ומחברים.',ex:'7 × 8 = 7 × 5 + 7 × 3 = 35 + 21',p:()=>[rnd(6,9),rnd(6,9)]},
  {id:'t9f',icon:'🌟',name:'הספרות של 9',text:'בכפולות של 9 (עד 90) הספרות של התשובה תמיד מסתכמות ל־9.',ex:'9 × 7 = 63 → 6 + 3 = 9',p:()=>[9,rnd(2,9)]}
];

/* ---------- game state ---------- */
const CHARS=['🧜‍♀️','🧚‍♀️','🦄','🦊','🐱','🧙‍♀️','🐼','🦖'];
let S={name:store.get('name',''),char:store.get('char','🧜‍♀️'),pos:0,pirate:0,hearts:3,stars:0,split:1,pirateStuck:0,pirateArrived:false,board:[],sessionLog:[]};
const stage=$('#stage');
const ICON={start:'⛵',chest:'🎁',magic:'✨',echo:'🔮',monster:'👾',dragon:'🐉',castle:'🏰'};
const LAST=29;

function makeBoard(){
  const b=Array(30).fill('plain');b[0]='start';b[LAST]='castle';
  b[6]='monster';b[12]='dragon';b[19]='monster';b[25]='dragon';
  const pool=['chest','chest','chest','chest','chest','magic','magic','magic','magic','echo','echo','echo','echo'];

/* ---------- hints ---------- */
function mulHint(a,b){
  const has=n=>a===n||b===n,other=n=>a===n?b:a;
  if(has(1)){const x=other(1);return M(x+' × 1 = '+x)}
  if(has(10)){const x=other(10);return M(x+' → '+x+'0')}
  if(has(2)){const x=other(2);return M(x+' + '+x+' = ?')}
  if(has(5)){const x=other(5);return M(x+' × 10 = '+x*10+' → ½ = ?')}
  if(has(9)){const x=other(9);return M(x+' × 10 = '+x*10+' → '+x*10+' − '+x+' = ?')}
  if(has(4)){const x=other(4);return M(x+' → '+2*x+' → ?')}
  if(has(8)){const x=other(8);return M(x+' → '+2*x+' → '+4*x+' → ?')}
  if(has(3)){const x=other(3);return M(x+' + '+x+' + '+x+' = ?')}
  const big=Math.max(a,b),small=Math.min(a,b),r=big-5;
  return `${M(small+' × 5 = '+small*5)}<br>${M(small+' × '+r+' = ?')}<br>${M(small*5+' + ? = ?')}`;
}
function dots(rows,cols){
  if(rows*cols>100)return '';
  let h=`<div class="dots" style="grid-template-columns:repeat(${cols},10px)">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)h+=`<i class="${c===4&&cols>5?'c5':''} ${r===4&&rows>5?'r5':''}"></i>`;
  return h+'</div>';
}
function hintHTML(q,level){
  if(!level)return '';
  let parts=[];
  if(q.kind==='mul'){
    parts.push(mulHint(q.a,q.b));
    if(level>=2)parts.push(dots(q.a,q.b));
  }else{
    parts.push(M('? × '+q.a+' = '+q.c));
    if(level>=2)parts.push(q.mem?`🔮 ${M(q.mem.a+' × '+q.mem.b+' = '+q.mem.c)}`:dots(q.answer,q.a));
  }
  if(level>=3)parts.push(`<b>✍️ ${M(q.answer)}</b>`);
  return `<div class="box">${parts.map(p=>`<div>${p}</div>`).join('')}</div>`;
}

/* ---------- asking an exercise ---------- */
let current=null;
function ask(q){return new Promise(resolve=>{current={q,input:'',tries:0,level:0,note:'',resolve};renderAsk()})}
function canSplit(q){return q.canSplit&&q.kind==='mul'&&Math.min(q.a,q.b)>=2&&Math.max(q.a,q.b)>=4&&!current.note}
function renderAsk(msg){
  const c=current,q=c.q,box=`<span class="ans" id="ans">${c.input||'&nbsp;'}</span>`;
  const expr=q.kind==='mul'?`<span>${q.a} × ${q.b} =</span>${box}`:q.kind==='div'?`<span>${q.c} ÷ ${q.a} =</span>${box}`:`${box}<span>× ${q.a} = ${q.c}</span>`;
  stage.innerHTML=`
    ${q.head||''}
    <h2>${q.title}</h2>
    ${q.sub?`<p class="sub">${q.sub}</p>`:''}
    <div class="expr" id="expr" dir="ltr">${expr}</div>
    ${c.note?`<div class="note" dir="ltr">${c.note}</div>`:''}
    <div class="hint">${msg?`<p style="margin:0 0 6px;font-weight:700">${msg}</p>`:''}</div>
    <div class="pad" dir="ltr">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
      <button class="key fn" data-k="del" aria-label="מחיקה">⌫</button><button class="key" data-k="0">0</button><button class="key go" data-k="ok" aria-label="בדיקה">✓</button></div>
    <div class="tools">
      
      ${canSplit(q)?`<button class="btn ghost" id="splitBtn">✂️ פירוק</button>`:''}
    </div>`;
  stage.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.k));
  const hb=$('#hintBtn');if(hb)hb.onclick=()=>{c.level=Math.min(3,c.level+1);renderAsk()};
  const sb=$('#splitBtn');if(sb)sb.onclick=splitFlow;
}
function press(k){
  const c=current;if(!c||c.locked)return;
  if(k==='del')c.input=c.input.slice(0,-1);
  else if(k==='ok')return submit();
  else if(c.input.length<3)c.input+=k;
  $('#ans').innerHTML=c.input||'&nbsp;';
}
async function submit(){
  const c=current;if(!c||c.input===''||c.locked)return;
  const q=c.q;
  if(+c.input===q.answer){
    c.locked=true;sfx.ok();$('#expr').classList.add('ok');
    if(q.kind==='mul'&&q.track!==false){recordFact(q.a,q.b,c.tries===0);addLog(q.a,q.b)}
    if(q.track!==false){
      const t=q.kind==='mul'?`${q.a} × ${q.b} = ${q.answer}`:q.kind==='div'?`${q.c} ÷ ${q.a} = ${q.answer}`:`${q.answer} × ${q.a} = ${q.c}`;
      const k=q.kind==='mul'?'m'+key(q.a,q.b):'d'+q.c+'/'+q.a;
      S.results.push({k,t,ok:c.tries===0});
    }
    await sleep(700);current=null;c.resolve({firstTry:c.tries===0});
  }else{
    c.tries++;sfx.soft();c.input='';c.level=Math.max(c.level,Math.min(3,c.tries));
    if(q.onWrong&&q.onWrong()==='abort'){current=null;c.resolve({aborted:true});return}
    renderAsk('כמעט! 🔁');
    $('#expr').classList.add('shake');
  }
}
async function splitFlow(){
  const main=current,q=main.q;sfx.magic();
  const big=Math.max(q.a,q.b),small=Math.min(q.a,q.b),p=big>5?5:Math.floor(big/2),r=big-p;
  await ask({kind:'mul',a:small,b:p,answer:small*p,title:'✂️ 1',sub:M(small+' × '+big),track:false});
  await ask({kind:'mul',a:small,b:r,answer:small*r,title:'✂️ 2',sub:M(small+' × '+big),track:false});
  main.note=`${small*p} + ${small*r} = ?`;
  current=main;renderAsk('✂️ ➕');
}
document.addEventListener('keydown',e=>{
  if(!current||$('.overlay.on'))return;
  if(/^[0-9]$/.test(e.key)){press(e.key);e.preventDefault()}
  else if(e.key==='Backspace'){press('del');e.preventDefault()}

  const learned=TRICKS.filter(t=>tricks.includes(t.id));
  openInfo(`<h2>📖 ספר הכשפים</h2>
    <p class="sub" style="align-self:center">גילית ${learned.length} מתוך ${TRICKS.length} כשפים. כשפים חדשים מחכים במשבצות ✨</p>
    <div class="list">${TRICKS.map(t=>tricks.includes(t.id)?`<div class="trick"><b>${t.icon} ${t.name}</b><div>${t.text}</div><span class="ex" dir="ltr" style="font-size:1.1rem">${t.ex}</span></div>`:`<div class="trick locked"><b>❔ כשף נעלם</b></div>`).join('')}</div>
    ${pets.length?`<h2>🐲 דרקוני מחמד</h2><div class="chips">${pets.map(p=>`<span class="chip" dir="ltr">${p.replace('x',' × ')}</span>`).join('')}</div>`:''}`);
};
$('#logBtn').onclick=()=>{
  const items=log.slice().reverse();
  const n=nemesis();
  openInfo(`<h2>📜 ספר ההרפתקאות</h2>
    <p class="sub" style="align-self:center">כל תרגיל שפתרת נשמר כאן. קלף ההד מחזיר תרגילים מהספר, הפוכים.</p>
    ${items.length?`<div class="chips">${items.map(e=>`<span class="chip" dir="ltr">${e.a} × ${e.b} = ${e.c}</span>`).join('')}</div>`:'<p>הספר עוד ריק. בואי נתחיל!</p>'}
    <p class="sub" style="align-self:center">הדרקון הנוכחי שומר על ${M(n.a+' × '+n.b)}${dragons[n.k]!=null?` (כוח ${dragons[n.k]} מתוך 4)`:''}.</p>`);
};
$('#muteBtn').onclick=()=>{muted=!muted;store.set('muted',muted);hud()};

/* ---------- start ---------- */
function renderChars(){
  $('#chars').innerHTML=CHARS.map(c=>`<button type="button" aria-pressed="${c===S.char}" data-c="${c}" aria-label="דמות">${c}</button>`).join('');
  $('#chars').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.char=b.dataset.c;renderChars()});
}
$('#nameInput').value=S.name;renderChars();
function newGame(){
  Object.assign(S,{pos:0,pirate:0,hearts:3,stars:0,split:1,pirateStuck:0,pirateArrived:false,board:makeBoard(),sessionLog:[],results:[],turn:0,lastRoad:null,newPet:null});
  renderMap();hud();
  card({icon:`${S.char} 🆚 🏴‍☠️`,title:'מי תגיע ראשונה? 🏰',text:'',btn:'יוצאים! ▶'}).then(diceStage);
}
$('#startBtn').onclick=()=>{
  S.name=$('#nameInput').value.trim()||'הרפתקנית';store.set('name',S.name);store.set('char',S.char);
  $('#startOv').classList.remove('on');newGame();
};
$('#nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#startBtn').click()});
// board visible behind the start screen
S.board=makeBoard();renderMap();hud();
stage.innerHTML=`<div class="card-icon">🏴‍☠️</div><h2>הפיראט מחכה...</h2><p class="sub">בחרי דמות ויוצאים לדרך.</p>`;
</script>
</body>
</html>
